[project]
name = "blacklight"
version = "0.1.0"
description = "Blacklight - AI Agent Builder Platform"
readme = "README.md"
authors = [
    { name = "Cole Agard", email = "ctagard19@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.119.0",
    "langchain-community>=0.3.13",
    "langchain-core>=0.3.79",
    "langchain-openai>=0.3.35",
    "langgraph>=0.6.10",
    "langchain-mcp-adapters>=0.1.0",
    "mcp[ws]>=0.1.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "sse-starlette>=2.2.0",
    "uvicorn[standard]>=0.37.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "fastapi-users[oauth,sqlalchemy]>=14.0.1",
    "httpx-oauth>=0.16.1",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
    "asyncpg>=0.30.0",
    "structlog>=25.4.0",
    "asgi-correlation-id>=4.3.4",
    "python-json-logger>=4.0.0",
    "jinja2>=3.1.6",
    "docker>=7.1.0",
    "jsonschema>=4.25.1",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.59b0",
    "opentelemetry-instrumentation-httpx>=0.59b0",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-exporter-prometheus>=0.59b0",
]

[project.scripts]
blacklight = "blacklight:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | alembic/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true
pretty = true
namespace_packages = true
explicit_package_bases = true

# Exclude patterns
exclude = [
    "alembic/versions/",
    "generated/",
    "scripts/",
]

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "sse_starlette.*",
    "slowapi.*",
    "pythonjsonlogger.*",
    "asgi_correlation_id.*",
    "docker.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "black>=25.9.0",
    "mypy>=1.18.2",
    "ruff>=0.14.1",
]
