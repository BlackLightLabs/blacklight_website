events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server host.docker.internal:5173;
    }

    upstream backend {
        server host.docker.internal:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend - React app
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # WebSocket support for Vite HMR
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API - FastAPI
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            # Include port in Host header so OAuth redirects work correctly
            proxy_set_header Host $host:3000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:3000;
            proxy_set_header X-Forwarded-Port 3000;

            # Important: Pass cookies through proxy
            proxy_pass_request_headers on;
            proxy_set_header Cookie $http_cookie;
        }

        # Backend root (for any non-API endpoints like health checks)
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
